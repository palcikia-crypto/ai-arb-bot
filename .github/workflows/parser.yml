name: Auto Scanner
on:
  schedule:
    - cron: '*/15 * * * *'   # Каждые 15 минут
  workflow_dispatch:          # Кнопка ручного запуска

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scanner
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python super_scanner_v8.py > scan_output.txt 2>&1 || true
          # Копируем вывод в файл для истории
          cp scan_output.txt results.txt

      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.txt || true
          git commit -m "Update scan results $(date -u)" || true
          git push || true
