name: Auto Scanner
on:
  schedule:
    - cron: '0 * * * *'   # Раз в час (чтобы не сжечь минуты)
  workflow_dispatch:      # Ручной запуск

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # РАЗРЕШАЕМ БОТУ ДЕЛАТЬ КОММИТЫ
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scanner
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python super_scanner_v8.py > results.txt 2>&1 || true

      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.txt
          git commit -m "Update scan results $(date -u)" || echo "No changes"
          git pull --rebase origin main
          git push origin main
